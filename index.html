<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Skryté Kódy - Kalendár</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
            min-height: 100vh;
            color: #f8fafc;
        }

        /* 3D Flip Card Styles */
        .perspective-1000 {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-inner.is-open {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 1rem;
        }

        .card-front {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .card-front:hover {
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 15px 35px -10px rgba(99, 102, 241, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.2);
            transform: translateY(-4px);
        }

        .card-back {
            background: linear-gradient(145deg, #1e1b4b, #0f172a);
            border: 1px solid rgba(129, 140, 248, 0.3);
            box-shadow: 0 12px 30px -10px rgba(99, 102, 241, 0.4);
            transform: rotateY(180deg);
        }

        .gold-badge {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }

        .door-handle {
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.6), 0 1px 1px rgba(255,255,255,0.2);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-between min-h-screen">

    <header class="text-center max-w-3xl my-4">
        <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 text-xs font-semibold mb-3 backdrop-blur-md">
            <i data-lucide="apple" class="w-4 h-4"></i> Overené a funkčné kódovacie menu
        </div>
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-indigo-300 mb-2">
            iPhone Tajný Kalendár
        </h1>
        <p class="text-slate-400 text-xs md:text-base max-w-xl mx-auto">
            Klikni na okienko kalendára a otvor si "čokoládku" – jediný skutočne fungujúci skrytý kód pre tvoj iPhone! 🍫📱
        </p>
        
        <!-- Quick stats & control buttons -->
        <div class="mt-4 flex flex-wrap justify-center items-center gap-3 text-xs font-semibold">
            <button id="openAllBtn" onclick="toggleAllCards(true)" class="px-3.5 py-2 rounded-xl bg-indigo-600/80 hover:bg-indigo-600 text-white transition-all flex items-center gap-2 shadow-lg shadow-indigo-600/20">
                <i data-lucide="eye" class="w-4 h-4"></i> Otvoriť všetky okienka
            </button>
            <button id="closeAllBtn" onclick="toggleAllCards(false)" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all flex items-center gap-2 border border-slate-700">
                <i data-lucide="eye-off" class="w-4 h-4"></i> Zatvoriť všetky
            </button>
            <span id="openedCounter" class="px-3.5 py-2 rounded-xl bg-slate-900/60 border border-slate-800 text-amber-400 flex items-center gap-1.5">
                <i data-lucide="gift" class="w-4 h-4"></i> Otvorené: <span id="countNum">0</span> / 18
            </span>
        </div>
    </header>

    <main class="w-full max-w-6xl my-auto">
        <div id="calendarGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-5">
            <!-- Cards generated dynamically via JavaScript -->
        </div>
    </main>

    <footer class="mt-8 text-center text-xs text-slate-500 max-w-md">
        <p class="flex items-center justify-center gap-1">
            <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400"></i> Všetky kódy sa zadávajú do aplikácie <strong>Telefón (Číselník)</strong>.
        </p>
    </footer>

    <script>
        // Array of 18 genuine working iPhone codes
        const iphoneCodes = [
            {
                number: 1,
                title: "IMEI a Sériové číslo",
                code: "*#06#",
                category: "Info",
                icon: "smartphone",
                description: "Zobrazí tvoje IMEI, EID a MEID čísla bez stlačenia volania."
            },
            {
                number: 2,
                title: "Field Test Režim",
                code: "*3001#12345#*",
                category: "Sieť",
                icon: "radio",
                description: "Otvorí vývojárske menu mobilnej siete, signálu v dBm a 5G/LTE pásiem."
            },
            {
                number: 3,
                title: "Právne informácie",
                code: "*#07#",
                category: "Info",
                icon: "file-text",
                description: "Otvorí systémové certifikácie a limitné hodnoty RF expozície."
            },
            {
                number: 4,
                title: "Jednorazové skrytie čísla",
                code: "#31#číslo",
                category: "Volania",
                icon: "eye-off",
                description: "Skryje tvoje číslo pre práve vytáčaný hovor (napr. #31#0901234567)."
            },
            {
                number: 5,
                title: "Stav skrytia čísla",
                code: "*#31#",
                category: "Volania",
                icon: "shield",
                description: "Zistí, či máš na sieti zapnuté alebo zablokované zobrazovanie ID."
            },
            {
                number: 6,
                title: "Zobrazenie prichádzajúceho ID",
                code: "*#30#",
                category: "Volania",
                icon: "user-check",
                description: "Overí, či ti sieť korektne zobrazuje čísla volajúcich (CLIP)."
            },
            {
                number: 7,
                title: "Presmerovanie hovorov (Stav)",
                code: "*#21#",
                category: "Presmerovanie",
                icon: "phone-forwarded",
                description: "Zistí stav bezpodmienečne presmerovaných všetkých hovorov."
            },
            {
                number: 8,
                title: "Zapnúť presmerovanie",
                code: "**21*číslo#",
                category: "Presmerovanie",
                icon: "phone-outgoing",
                description: "Zapne okamžité presmerovanie všetkých prichádzajúcich hovorov."
            },
            {
                number: 9,
                title: "Vypnúť presmerovanie",
                code: "##21#",
                category: "Presmerovanie",
                icon: "phone-off",
                description: "Vypne bezpodmienečné presmerovanie všetkých hovorov."
            },
            {
                number: 10,
                title: "Presmerovanie pri nedvíhaní",
                code: "*#61#",
                category: "Presmerovanie",
                icon: "clock",
                description: "Zistí stav presmerovania v prípade, že hovor nezdvihneš."
            },
            {
                number: 11,
                title: "Presmerovanie pri nedostupnosti",
                code: "*#62#",
                category: "Presmerovanie",
                icon: "wifi-off",
                description: "Zistí stav presmerovania, ak si vypnutý alebo bez signálu."
            },
            {
                number: 12,
                title: "Presmerovanie pri obsadení",
                code: "*#67#",
                category: "Presmerovanie",
                icon: "phone-missed",
                description: "Zistí stav presmerovania, keď práve s niekým telefonuješ."
            },
            {
                number: 13,
                title: "Reset všetkých presmerovaní",
                code: "##002#",
                category: "Presmerovanie",
                icon: "rotate-ccw",
                description: "Rýchly reset: Zruší úplne všetky aktívne presmerovania naraz!"
            },
            {
                number: 14,
                title: "Stav čakajúceho hovoru",
                code: "*#43#",
                category: "Čakajúci hovor",
                icon: "phone-call",
                description: "Zistí, či ťa iPhone upozorní na druhý hovor počas telefonovania."
            },
            {
                number: 15,
                title: "Zapnúť čakajúci hovor",
                code: "*43#",
                category: "Čakajúci hovor",
                icon: "phone-incoming",
                description: "Aktivuje službu upozornenia na druhý prichádzajúci hovor."
            },
            {
                number: 16,
                title: "Vypnúť čakajúci hovor",
                code: "#43#",
                category: "Čakajúci hovor",
                icon: "phone-off",
                description: "Deaktivuje upozornenia na druhý paralelne prichádzajúci hovor."
            },
            {
                number: 17,
                title: "Blokovanie odchádzajúcich hovorov",
                code: "*#33#",
                category: "Blokovanie",
                icon: "lock",
                description: "Skontroluje stav blokovania odchádzajúcich hovorov (Call Barring)."
            },
            {
                number: 18,
                title: "Číslo SMS Centra (SMSC)",
                code: "*#5005*7672#",
                category: "SMS",
                icon: "message-square",
                description: "Zobrazí číslo spracovateľského SMS centra tvojho operátora."
            }
        ];

        let openedCount = 0;

        // Render Calendar Grid
        function renderCalendar() {
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            iphoneCodes.forEach((item) => {
                const cardHTML = `
                    <div class="perspective-1000 min-h-[260px] w-full" onclick="toggleCard(this)">
                        <div class="card-inner" id="card-${item.number}">
                            <!-- FRONT OF THE DOOR (Advent door look) -->
                            <div class="card-front flex flex-col justify-between">
                                <div class="flex justify-between items-start gap-2">
                                    <span class="w-8 h-8 rounded-full gold-badge text-slate-950 font-black text-xs flex items-center justify-center shadow-md shrink-0">
                                        ${item.number}
                                    </span>
                                    <span class="text-[10px] font-semibold tracking-wider uppercase text-indigo-300 bg-indigo-950/60 border border-indigo-800/50 px-2 py-0.5 rounded-full text-right truncate">
                                        ${item.category}
                                    </span>
                                </div>
                                
                                <div class="text-center my-2">
                                    <div class="w-10 h-10 mx-auto rounded-full bg-slate-800/80 border border-slate-700/60 flex items-center justify-center text-amber-400 mb-2">
                                        <i data-lucide="gift" class="w-5 h-5"></i>
                                    </div>
                                    <p class="text-sm font-bold text-slate-200 leading-snug">${item.title}</p>
                                </div>

                                <div class="flex items-center justify-between text-[11px] text-slate-400 border-t border-slate-700/40 pt-2 mt-auto">
                                    <span class="text-slate-400 font-medium">Otvor okienko</span>
                                    <div class="w-3.5 h-3.5 rounded-full bg-slate-700 door-handle"></div>
                                </div>
                            </div>

                            <!-- BACK OF THE DOOR ("Chocolate" / Code reveal) -->
                            <div class="card-back flex flex-col justify-between">
                                <div class="flex justify-between items-start gap-2 mb-1">
                                    <span class="text-[11px] font-bold uppercase tracking-wider text-amber-400 flex items-center gap-1 leading-tight">
                                        <i data-lucide="${item.icon}" class="w-3.5 h-3.5 shrink-0"></i> <span>${item.title}</span>
                                    </span>
                                    <span class="text-[10px] text-slate-400 shrink-0">#${item.number}</span>
                                </div>

                                <div class="bg-slate-950/90 border border-indigo-500/30 rounded-lg p-2 text-center shadow-inner my-1">
                                    <p class="text-[10px] text-slate-400 uppercase tracking-wider mb-0.5">Kód:</p>
                                    <p class="font-mono text-base font-extrabold text-indigo-300 tracking-wider select-all break-all">${item.code}</p>
                                </div>

                                <p class="text-xs text-slate-300 leading-normal my-1">${item.description}</p>

                                <button onclick="copyCode(event, '${item.code}')" class="w-full py-1.5 rounded-md bg-indigo-600/50 hover:bg-indigo-600 border border-indigo-500/40 text-white text-xs font-semibold transition-all flex items-center justify-center gap-1.5 mt-auto">
                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i> Kopírovať kód
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += cardHTML;
            });

            lucide.createIcons();
        }

        // Toggle Single Card Flip
        function toggleCard(wrapper) {
            const inner = wrapper.querySelector('.card-inner');
            inner.classList.toggle('is-open');
            updateCount();
        }

        // Copy Code to Clipboard
        function copyCode(event, text) {
            event.stopPropagation(); // prevent flipping back
            const dummy = document.createElement('textarea');
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand('copy');
            document.body.removeChild(dummy);

            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i> Skopírované!`;
            btn.classList.add('bg-emerald-600/60', 'border-emerald-500/50');
            lucide.createIcons();

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-emerald-600/60', 'border-emerald-500/50');
                lucide.createIcons();
            }, 1800);
        }

        // Toggle All Cards
        function toggleAllCards(open) {
            const cards = document.querySelectorAll('.card-inner');
            cards.forEach(card => {
                if (open) {
                    card.classList.add('is-open');
                } else {
                    card.classList.remove('is-open');
                }
            });
            updateCount();
        }

        // Update Opened Count Counter
        function updateCount() {
            const openCards = document.querySelectorAll('.card-inner.is-open').length;
            document.getElementById('countNum').innerText = openCards;
        }

        // Initialize on Load
        window.onload = () => {
            renderCalendar();
        };
    </script>
</body>
</html>
